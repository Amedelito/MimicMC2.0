name: Build plugin

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compilar
        run: mvn -B package -f "$(find . -name pom.xml -not -path '*/node_modules/*' | head -1)"

      - name: Subir el jar
        uses: actions/upload-artifact@v4
        with:
          name: Mimic-jar
          path: '**/target/Mimic-*.jar'
