def paw(c):
    fur,dark,light,acc=c.pal_paw
    m=Creature(c.name+"_mano",0)
    m.cube("p",[6,0,6],[10,11,10],fur); m.cube("p",[5.5,10,5.5],[10.5,15,10.5],light if c.name in("nutria","capibara","gato","oso") else fur)
    m.cube("p",[7.1,10.5,10.5],[7.5,15,10.7],dark); m.cube("p",[8.5,10.5,10.5],[8.9,15,10.7],dark)
    for x in (6,7.4,8.8): m.cube("p",[x,15,8.5],[x+1.2,16.2,10],acc)
    return m

# ------------------------------------------------------------------ escritura
if os.path.exists(OUT): shutil.rmtree(OUT)
for d in ("models/item","textures/item"): os.makedirs(f"{OUT}/assets/{NS}/{d}")
os.makedirs(f"{OUT}/assets/minecraft/models/item")
overrides=[]; creatures=[f() for f in (nutria,capibara,rana,oso,gato,conejo,pinguino)]
cfg=["# Generado por build_pack.py - cada criatura se compone de PARTES animadas por el plugin.",
"# partes: modelo (custom_model_data) | rol (animacion) | pivote [x,y,z] en unidades de modelo (16 = 1 bloque)",
"# roles: cuerpo, cabeza, pata_a/pata_b (diagonales), pata_s (a la vez), cola, oreja_l/r, aleta_l/r",
"","# true = tu no ves tu propio modelo. false = lo ves (en F5 / tercera persona)","ocultar-a-si-mismo: false",
"# La cabeza gira hacia donde miras (true) o queda fija (false)","cabeza-sigue: true","",
"# Patita de 1a persona (solo la ves tu). Distancias en bloques respecto a tu camara",
"mano:","  derecha: 0.3","  abajo: 0.3","  adelante: 0.55","  escala: 0.5","",
"# escala: tamano del modelo | escala-jugador: tamano real del jugador (hitbox/camara)",
"# velocidad: multiplicador | amplitud: grados de balanceo de patas | salta: avanza a saltitos",
"# giro: grados para orientar el modelo (180 si se ve al reves) | balanceo: inclinacion lateral al andar",
"criaturas:"]
pawc={}
for ci,c in enumerate(creatures):
    json_tex=f"{NS}:item/{c.name}"
    c.texture().save(f"{OUT}/assets/{NS}/textures/item/{c.name}.png")
    parts=[]
    for pi,(pn,els) in enumerate(c.parts.items()):
        if not els: continue
        cmd=2000+c.idx*20+pi
        json.dump({"textures":{"0":json_tex,"particle":json_tex},"texture_size":[16,16],"elements":els,"display":BODY_DISPLAY},
                  open(f"{OUT}/assets/{NS}/models/item/{c.name}_{pn}.json","w"),indent=1)
        overrides.append({"predicate":{"custom_model_data":cmd},"model":f"{NS}:item/{c.name}_{pn}"})
        rol,piv=c.rig[pn]; parts.append((cmd,rol,piv))
    p=paw(c); pcmd=1101+c.idx; pt=f"{NS}:item/{p.name}"
    p.texture().save(f"{OUT}/assets/{NS}/textures/item/{p.name}.png")
    json.dump({"textures":{"0":pt,"particle":pt},"texture_size":[16,16],"elements":p.parts["p"],"display":PAW_DISPLAY},
              open(f"{OUT}/assets/{NS}/models/item/{p.name}.json","w"),indent=1)
    overrides.append({"predicate":{"custom_model_data":pcmd},"model":f"{NS}:item/{p.name}"})
    cf=c.cfg
    cfg+= [f"  {c.name}:","    material: PAPER",f"    modelo-mano: {pcmd}",f"    escala: {cf['escala']}",
           f"    escala-jugador: {cf['jugador']}",f"    velocidad: {cf['vel']}","    giro: 0",f"    amplitud: {cf['amp']}",
           f"    salta: {str(cf.get('salta',False)).lower()}",f"    balanceo: {cf.get('balanceo',0.06)}",
           "    efectos: ["+", ".join(f'"{e}"' for e in cf['efectos'])+"]","    partes:"]
    for cmd,rol,piv in parts:
        cfg.append(f"      - {{modelo: {cmd}, rol: {rol}, pivote: [{piv[0]}, {piv[1]}, {piv[2]}]}}")
json.dump({"parent":"minecraft:item/generated","textures":{"layer0":"minecraft:item/paper"},"overrides":overrides},
          open(f"{OUT}/assets/minecraft/models/item/paper.json","w"),indent=1)
json.dump({"pack":{"pack_format":34,"description":"Mimic - criaturas custom animadas"}},open(f"{OUT}/pack.mcmeta","w"),indent=1)
open(CONFIG_OUT,"w").write("\n".join(cfg)+"\n")
with zipfile.ZipFile("MimicPack.zip","w",zipfile.ZIP_DEFLATED) as zf:
    for r,_,fs in os.walk(OUT):
        for f in fs:
            p=os.path.join(r,f); zf.write(p,os.path.relpath(p,OUT))
print("sha1",hashlib.sha1(open("MimicPack.zip","rb").read()).hexdigest())

# ------------------------------------------------------------------ vista previa (todas las partes juntas)
def render(c,size=260):
    img=Image.new("RGB",(size,size),(48,52,60)); dr=ImageDraw.Draw(img)
    ph,pt=math.radians(-35),math.radians(-25)
    def tr(p):
        x,y,z=p[0]-8,p[1]-8,p[2]-8
        x,z=x*math.cos(ph)-z*math.sin(ph), x*math.sin(ph)+z*math.cos(ph)
        y,z=y*math.cos(pt)-z*math.sin(pt), y*math.sin(pt)+z*math.cos(pt)
        return x,y,z
    nrm={"north":(0,0,-1),"south":(0,0,1),"west":(-1,0,0),"east":(1,0,0),"up":(0,1,0),"down":(0,-1,0)}
    faces=[]; o=tr((8,8,8))
    for els in c.parts.values():
        for e in els:
            (x0,y0,z0),(x1,y1,z1)=e["from"],e["to"]
            V={"north":[(x0,y0,z0),(x1,y0,z0),(x1,y1,z0),(x0,y1,z0)],"south":[(x0,y0,z1),(x1,y0,z1),(x1,y1,z1),(x0,y1,z1)],
               "west":[(x0,y0,z0),(x0,y0,z1),(x0,y1,z1),(x0,y1,z0)],"east":[(x1,y0,z0),(x1,y0,z1),(x1,y1,z1),(x1,y1,z0)],
               "up":[(x0,y1,z0),(x1,y1,z0),(x1,y1,z1),(x0,y1,z1)],"down":[(x0,y0,z0),(x1,y0,z0),(x1,y0,z1),(x0,y0,z1)]}
            uv=e["faces"]["north"]["uv"]; col=hex2rgb(c.pal[(uv[1]//4)*4+uv[0]//4])
            for k,vs in V.items():
                n=nrm[k]; nt=tr((n[0]+8,n[1]+8,n[2]+8)); nv=(nt[0]-o[0],nt[1]-o[1],nt[2]-o[2])
                if nv[2]>0.05: continue
                pts=[tr(v) for v in vs]; zc=sum(p[2] for p in pts)/4
                sh=0.55+0.45*max(0,(-nv[2]*0.5+nv[1]*0.6+0.2))
                faces.append((zc,[(size/2+p[0]*size/26,size/2-p[1]*size/26+size*0.05) for p in pts],tuple(int(min(255,v*sh)) for v in col)))
    for zc,pts,col in sorted(faces,key=lambda a:-a[0]): dr.polygon(pts,fill=col)
    return img
sheet=Image.new("RGB",(260*4,260*2),(48,52,60))
for i,c in enumerate(creatures): sheet.paste(render(c),((i%4)*260,(i//4)*260))
sheet.save("preview.png")
