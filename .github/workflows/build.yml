    c.mirror("cabeza",[5.6,14,4.8],[6.8,15.2,5],W); c.mirror("cabeza",[6.1,14.2,4.7],[6.7,15,4.8],K); c.setrig("cabeza","cabeza",[8,12,8])
    c.cube("aleta_l",[2.5,4,5.5],[4,10.5,10.5],F); c.setrig("aleta_l","aleta_l",[3.25,10,8])
