import json, os, random, math, shutil, hashlib, zipfile, sys
from PIL import Image, ImageDraw

OUT = "MimicPack"; NS = "mimic"
CONFIG_OUT = sys.argv[1] if len(sys.argv) > 1 else "config.yml"

def hex2rgb(h): h=h.lstrip('#'); return tuple(int(h[i:i+2],16) for i in (0,2,4))

class Creature:
    """Criatura = paleta compartida + partes (cuerpo, cabeza, patas...) con pivote y rol de animacion."""
    def __init__(self, name, idx, **cfg):
        self.name=name; self.idx=idx; self.cfg=cfg
        self.pal=[]; self.parts={}; self.rig={}   # rig[part]=(rol,pivot)
    def _col(self,c):
        if c not in self.pal: self.pal.append(c)
        return self.pal.index(c)
    def cube(self,part,f,t,c):
        i=self._col(c); cx,cy=i%4,i//4; uv=[cx*4,cy*4,cx*4+4,cy*4+4]
        face={"uv":uv,"texture":"#0"}
        self.parts.setdefault(part,[]).append({"from":list(f),"to":list(t),
            "faces":{k:dict(face) for k in ("north","south","east","west","up","down")}})
    def mirror(self,part,f,t,c):
        self.cube(part,f,t,c); self.cube(part,[16-t[0],f[1],f[2]],[16-f[0],t[1],t[2]],c)
    def setrig(self,part,rol,pivot):
        self.rig[part]=(rol,list(pivot)); self.parts.setdefault(part,[])
    def legs(self,front,back,col,sync=False,front_extra=(),back_extra=()):
        """front/back: (from,to) de la pata izquierda; se crea la derecha en espejo.
        Pares diagonales (fl+br / fr+bl) o todas a la vez si sync."""
        spec=[("pata_fl",front,front_extra,"pata_s" if sync else "pata_a",False),
              ("pata_fr",front,front_extra,"pata_s" if sync else "pata_b",True),
              ("pata_bl",back,back_extra,"pata_s" if sync else "pata_b",False),
              ("pata_br",back,back_extra,"pata_s" if sync else "pata_a",True)]
        for nm,(f,t),extra,rol,mir in spec:
            cubes=[(f,t,col)]+[(a,b,c) for a,b,c in extra]
            for a,b,c in cubes:
                if mir: a,b=[16-b[0],a[1],a[2]],[16-a[0],b[1],b[2]]
                self.cube(nm,a,b,c)
            px=(f[0]+t[0])/2; px=16-px if mir else px
            self.setrig(nm,rol,[px,t[1],(f[2]+t[2])/2])
    def texture(self):
        img=Image.new("RGBA",(16,16),(0,0,0,0)); rnd=random.Random(self.name)
        for i,c in enumerate(self.pal):
            r,g,b=hex2rgb(c); cx,cy=(i%4)*4,(i//4)*4
            for y in range(4):
                for x in range(4):
                    d=rnd.choice([-12,-6,0,0,0,6,12])
                    img.putpixel((cx+x,cy+y),(max(0,min(255,r+d)),max(0,min(255,g+d)),max(0,min(255,b+d)),255))
        return img

