    B,D,C,K="#7a5230","#4e3320","#d9c3a0","#1a1210"
    c.cube("cuerpo",[5,3.5,3],[11,8,13],B); c.cube("cuerpo",[5,2,3.5],[11,3.5,12.5],C)
    c.cube("cabeza",[5.5,4.5,0.5],[10.5,9.5,4.5],B); c.cube("cabeza",[6.5,4.5,0],[9.5,7,0.5],C)
    c.cube("cabeza",[7.3,6.2,-0.3],[8.7,7,0],K); c.mirror("cabeza",[6,7.6,0.2],[7,8.6,0.5],K)
    c.mirror("cabeza",[5.5,9.5,2.5],[6.7,10.6,3.7],D); c.setrig("cabeza","cabeza",[8,6,4])
    c.legs(([5.5,0,3.5],[7.5,3,5.5]),([5.5,0,10.5],[7.5,3,12.5]),D)
    c.cube("cola",[6.5,3,13],[9.5,5.5,17],D); c.cube("cola",[7,3.3,17],[9,5,18.5],D); c.setrig("cola","cola",[8,4.2,13])
    c.setrig("cuerpo","cuerpo",[8,4,8]); c.pal_paw=(B,D,C,K); return c
