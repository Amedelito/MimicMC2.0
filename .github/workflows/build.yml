def conejo():
    c=Creature("conejo",5,escala=0.8,jugador=0.35,vel=1.3,efectos=["jump_boost:3"],amp=45,salta=True)
    W,G,P,K="#f1ece6","#bdb4ab","#f0a9b4","#0b0b0b"
    c.cube("cuerpo",[5.5,3,5],[10.5,8,12],W); c.cube("cuerpo",[7,4,12],[9,6.5,14],W)
    c.cube("cabeza",[5.5,5.5,1],[10.5,10,5],W); c.mirror("cabeza",[6.1,8,0.8],[6.9,8.8,1],K); c.cube("cabeza",[7.6,6.8,0.8],[8.4,7.3,1],P)
    c.setrig("cabeza","cabeza",[8,7,4])
    # orejas independientes (se echan hacia atras al correr)
    for side,mir in (("oreja_l",False),("oreja_r",True)):
        f,t,f2,t2=[6,10,3],[7.3,16.5,4],[6.4,10.5,2.9],[7,15.5,3]
        if mir: f,t=[16-t[0],f[1],f[2]],[16-f[0],t[1],t[2]]; f2,t2=[16-t2[0],f2[1],f2[2]],[16-f2[0],t2[1],t2[2]]
        c.cube(side,f,t,W); c.cube(side,f2,t2,P); c.setrig(side,side,[8-1.35 if not mir else 8+1.35,10,3.5])
    c.legs(([5.5,0,4.5],[7,3,6]),([5.5,0,9],[7.5,2.5,13]),G,sync=True)
    c.setrig("cuerpo","cuerpo",[8,4,8]); c.pal_paw=(W,G,P,K); return c
def pinguino():
